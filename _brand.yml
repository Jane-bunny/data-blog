# Shared palette. Legacy names keep existing post shortcodes working.
color:
  palette:
    ivory: "#F8F5EF"
    beige: "#E8DED0"
    charcoal: "#302B27"
    taupe: "#74614F"
    sand: "#D2C4B2"
    graph-primary: "#74614F"
    plot-primary: "#74614F"
    chart-primary: "#74614F"
    story-primary: "#74614F"
    other-primary: "#E8DED0"
  background: ivory
  foreground: charcoal
  primary: taupe
  secondary: beige

# System fonts keep the site fast and avoid external font requests.
typography:
  base:
    family: Arial
    size: 17px
    line-height: 1.7
  headings:
    family: Georgia
    weight: 400
    color: charcoal
  link:
    color: taupe
    decoration: underline
