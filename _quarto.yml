project:
  type: website
  output-dir: docs
  render:
    - "**/*.qmd"
    - "!docs/**"
    - "!_site/**"

website:
  title: "Jane Zhang"
  description: "Data science, creative writing, and independent learning at the intersection of AI and energy."
  site-url: https://jane-bunny.github.io/data-blog/
  open-graph: 
    title: "Jane Zhang"
    description: "Data science, creative writing, and independent learning at the intersection of AI and energy."
  navbar:
    background: light
    collapse-below: lg
    left:
      - text: "About"
        href: about.qmd
      - text: "Data Projects"
        href: data-projects.qmd
      - text: "Writing"
        href: writing.qmd
      - text: "AI & Energy"
        href: ai-energy.qmd
  page-footer: 
    left: "© 2026 Jane Zhang"
    right:
      - text: "LinkedIn"
        href: https://www.linkedin.com/in/janezhang-techlearner/
      - text: "GitHub"
        href: https://github.com/Jane-bunny
      # When Jane confirms a public email address, add Contact here with an
      # envelope icon and a mailto: destination. No email link is active yet.

format:
  html:
    filters:
      - filters/figure-alt.lua
    theme:
      - flatly
      - brand.yml
      - custom.scss
    css: styles.css
    lang: en
    title-block-banner: false
    toc: false
    smooth-scroll: false
